name: 'lint'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # bun lint, bun fmt and bun check are only in canary for now
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CI: true

      - name: Lint
        run: bun lint
        env:
          CI: true

      - name: Format
        run: bun fmt --check
        env:
          CI: true

      - name: Typecheck
        run: node scripts/ensure-gleam.mjs && PATH="$PWD/node_modules/.bin:$PATH" gleam build && bun check
        env:
          CI: true
